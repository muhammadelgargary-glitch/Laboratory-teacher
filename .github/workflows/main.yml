name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build APK with NPX
        run: |
          npx @pwabuilder/cli@latest build --platform android --start-url https://muhammadelgargary-glitch.github.io/Laboratory-teacher/
          ls -la ./
          ls -la ./.pwabuilder/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            ./.pwabuilder/android/*.apk
            ./.pwabuilder/android/*.aab
          if-no-files-found: warn