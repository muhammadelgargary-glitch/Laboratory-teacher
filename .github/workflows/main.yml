name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PWA Builder
        run: npm install -g @pwabuilder/cli

      - name: Build APK
        run: |
          mkdir -p build
          cp index.html manifest.json sw.js icon-*.png build/
          cd build
          pwabuilder build --platform android --start-url https://muhammadelgargary-glitch.github.io/Laboratory-teacher/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/.pwabuilder/android/
