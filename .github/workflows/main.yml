name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          
          # إعداد ملف التهيئة التلقائي لتطبيق الأندرويد
          bubblewrap init --manifest ./manifest.json --directory android-app --skip-validation || true
          
          cd android-app
          
          # بناء ملف الـ APK بصيغة جاهزة للتثبيت
          bubblewrap build --manifest ../manifest.json
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android-app/*.apk
            android-app/app/build/outputs/apk/release/*.apk
            
