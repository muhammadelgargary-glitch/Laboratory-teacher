name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build APK
        run: |
          pwabuilder build --platform android --start-url https://muhammadelgargary-glitch.github.io/Laboratory-teacher/
          echo "Listing files to debug path:"
          ls -la ./.pwabuilder/ || echo "No .pwabuilder directory found"
          ls -la ./.pwabuilder/android/ || echo "No android directory found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./.pwabuilder/android/
          if-no-files-found: error
