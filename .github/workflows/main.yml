name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build APK with PWABuilder CLI
        run: |
          mkdir -p build
          cp index.html manifest.json sw.js icon-192.png build/ 2>/dev/null || true
          cd build
          npx @pwabuilder/pwabuilder-android@latest --name "LabApp" --manifest ./manifest.json --start_url ./index.html
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/android/
          
