name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install -g @pwabuilder/cli

      - name: Build APK
        run: |
          mkdir -p dist
          cp -r ./* dist/
          cd dist
          pwabuilder build --platform android --start-url https://muhammadelgargary-glitch.github.io/Laboratory-teacher/

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: dist/.pwabuilder/android/
