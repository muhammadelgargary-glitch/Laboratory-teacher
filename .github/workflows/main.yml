name: Build APK with Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Project
        run: |
          npx @bubblewrap/cli init --manifest https://muhammadelgargary-glitch.github.io/Laboratory-teacher/manifest.json
          npx @bubblewrap/cli build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: error          bubblewrap build --manifest ../manifest.json
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android-app/*.apk
            android-app/app/build/outputs/apk/release/*.apk
            
