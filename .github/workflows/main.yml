name: Build APK using WebIntoApp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebIntoApp CLI
        run: |
          wget -O webintoapp https://github.com/webintoapp/webintoapp/releases/latest/download/webintoapp-linux
          chmod +x webintoapp
          file webintoapp

      - name: Build APK
        run: |
          ./webintoapp build \
            --url https://muhammadelgargary-glitch.github.io/Laboratory-teacher/ \
            --name "الموسوعة الطبية" \
            --package "com.lab.medical" \
            --output app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app.apk
